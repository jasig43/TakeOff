# PRODUCTION (SPRING_PROFILES_ACTIVE=prod).
#
# All secrets must come from the environment / a secret manager:
#   MYSQL_URL, MYSQL_USER, MYSQL_PASSWORD, RABBITMQ_HOST, RABBITMQ_USER, RABBITMQ_PASSWORD,
#   JWT_SECRET (>= 32 random characters), OTP_PEPPER, FRONTEND_ORIGIN
# and, to create the first administrator once: ADMIN_SEED_ENABLED=true plus
#   ADMIN_SEED_EMAIL, ADMIN_SEED_PASSWORD, ADMIN_SEED_PHONE.

takeoff:
  otp:
    hash-codes: true
    log-to-console: false
    test-bypass:
      enabled: false

logging:
  level:
    root: INFO
    com.takeoff: INFO
