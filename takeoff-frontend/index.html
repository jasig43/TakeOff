<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="TakeOFF is a driver onboarding platform for courier and logistics companies: register, verify your phone, and start your driver application."
    />
    <title>TakeOFF | Driver Onboarding for Courier &amp; Logistics</title>
    <script>
      // Apply the saved (or OS-preferred) theme before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem('takeoff.theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
